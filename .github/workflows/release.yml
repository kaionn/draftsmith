name: Release

# バージョンの SSOT は .claude-plugin/plugin.json の version。
# 起動経路は 2 つ:
#   1. ローカル: scripts/release.sh が bump + CHANGELOG 昇格を commit → main へ push → push トリガーで tag / Release
#   2. GHA 完結: workflow_dispatch に bump を渡すと、bump ジョブが release.sh を runner 上で実行して
#      main へ push し、そのまま同一 run 内で tag / Release まで完結する
#      （GITHUB_TOKEN の push は push トリガーを発火しないため、別 run に任せる構成は成立しない）
on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json
  # bump=none（既定）は従来どおりの救済起動: bump せず plugin.json の現在値で tag / Release だけ作る。
  workflow_dispatch:
    inputs:
      bump:
        description: "バージョン bump の種別（none は bump せず現在値で tag / Release のみ）"
        type: choice
        default: none
        options: [none, patch, minor, major]

# repo 既定は default_workflow_permissions=read のため、tag push に必要な write を明示する。
permissions:
  contents: write

# 同一バージョンに対する tag push / Release 作成が並列で走らないようにする。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    # workflow_dispatch で bump 種別が指定されたときだけ動く
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    runs-on: ubuntu-latest
    env:
      # CHANGELOG の日付が runner の UTC で日本の前日にならないようにする
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: release.sh で bump して main へ push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./scripts/release.sh "${{ inputs.bump }}"
          git push origin main

  release:
    # push トリガー時は bump ジョブが skipped、dispatch + bump 時は success の後に走る。
    # bump が failure（[Unreleased] 空等）なら走らない
    needs: [bump]
    if: always() && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # bump ジョブが push した commit を含む最新 main を対象にする
          # （push トリガー時も plugin.json の現在値 = SSOT を読む意味は同じ）
          ref: main
          # 既存 tag の有無を判定するため全履歴 + tag を取得する
          fetch-depth: 0

      - name: バージョンを解決して 3 箇所の整合を検証
        id: version
        run: |
          set -euo pipefail
          V=$(jq -r '.version' .claude-plugin/plugin.json)
          MV=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          PV=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          if [[ -z "$V" || "$V" == "null" ]]; then
            echo "::error::plugin.json の version を読めなかった"
            exit 1
          fi
          if [[ "$V" != "$MV" || "$V" != "$PV" ]]; then
            echo "::error::バージョン不一致 plugin.json=${V} marketplace.metadata=${MV} marketplace.plugins[0]=${PV}"
            exit 1
          fi
          # tag は HEAD ではなく plugin.json を最後に変更したコミット（= bump commit）に打つ。
          # push トリガーでは両者は一致するが、workflow_dispatch での救済時は
          # bump commit の後に別のコミットが積まれていることがあり、HEAD に打つと tag 位置がずれる。
          SHA=$(git log -1 --format=%H -- .claude-plugin/plugin.json)
          if [[ -z "$SHA" ]]; then
            echo "::error::plugin.json の変更コミットを特定できなかった"
            exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "リリース対象: v${V} (${SHA})"
          git log -1 --format='  bump commit: %s' "$SHA"

      - name: CHANGELOG からリリースノートを抽出
        run: |
          set -euo pipefail
          # 該当セクションが空ならここで落ちる（ノートが空の Release を作らせない）
          ./scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > /tmp/release-notes.md
          {
            echo "${{ steps.version.outputs.tag }}"
            echo
            cat /tmp/release-notes.md
          } > /tmp/tag-message.md
          echo "--- release notes ---"
          cat /tmp/release-notes.md

      - name: tag を作成して push（既存ならスキップ）
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} は既に存在する。作成をスキップ"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -F /tmp/tag-message.md "${{ steps.version.outputs.sha }}"
          git push origin "${TAG}"
          echo "tag ${TAG} を ${{ steps.version.outputs.sha }} に作成した"

      - name: GitHub Release を作成（既存ならスキップ）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} は既に存在する。作成をスキップ"
            exit 0
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag
          echo "Release ${TAG} を作成した"
